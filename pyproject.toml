[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arkui-repository-aware-code-review-service"
version = "0.1.0"
description = "Repository-aware Code Review Service for OpenHarmony ArkUI Ace Engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arkui-review = "arkui_agent.review_service.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
